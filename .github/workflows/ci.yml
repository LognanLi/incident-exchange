name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (frontend + Convex)
        run: npm run typecheck
      - name: Unit, integration, and toy-app evaluator tests
        run: npm test
      - name: Production build
        run: npm run build
